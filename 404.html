<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="robots" content="noindex">
  <title>404 — Muhmd Gandi</title>
  <style>
    :root{--bg:#f4f3ef;--ink:#0b0b0b;--muted:#77756e;--accent:#ff5c35}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100svh;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(20px,4vw,64px)}
    header,footer{display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
    .brand{font-weight:800;font-size:16px;letter-spacing:-.03em;text-transform:none}
    main{display:grid;align-content:center;padding:60px 0}
    .code{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:18px}
    h1{font-size:clamp(64px,15vw,220px);line-height:.78;letter-spacing:-.075em;max-width:1400px}
    h1 span{color:var(--accent)}
    .bottom{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-top:46px}
    p{max-width:440px;color:var(--muted);font-size:15px;line-height:1.65}
    a.cta{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--ink);border-radius:999px;padding:13px 18px;font-weight:700;color:inherit;text-decoration:none;transition:.25s}
    a.cta:hover,a.cta:focus-visible{background:var(--ink);color:var(--bg);outline:none}
    a:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
    @media(max-width:650px){.bottom{align-items:start;flex-direction:column}footer span:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header><a class="brand" href="./">MUHMD GANDI®</a><span>Graphic Designer</span></header>
  <main>
    <div class="code">404 / Page not found</div>
    <h1>LOST<br><span>PAGE.</span></h1>
    <div class="bottom">
      <p>Halaman yang kamu cari tidak tersedia atau sudah berpindah. Kembali ke portfolio utama untuk melihat selected work, services, dan cara kerja Muhmd Gandi.</p>
      <a class="cta" href="./" aria-label="Kembali ke halaman utama portfolio Muhmd Gandi">Back to portfolio ↗</a>
    </div>
  </main>
  <footer><span>© 2026 Muhmd Gandi</span><span>Design with intention.</span></footer>
</body>
</html>
